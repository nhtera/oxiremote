name: release

# Triggered by `git tag vX.Y.Z && git push --tags`. Builds the agent binary
# on a native runner per target, uploads each artifact + a SHA256 manifest
# to a GitHub Release named `vX.Y.Z`. The manifest is what `oxiremote update`
# verifies downloads against — keep its filename in sync with `update.rs`.

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build"
        required: true

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS + Windows ship with the `audio` feature enabled — phase-02a
          # (ScreenCaptureKit single SCStream) on macOS and phase-02b (cpal
          # default-host WASAPI shared-mode loopback) on Windows. Linux stays
          # on default features (no audio backend wired yet); flipping `audio`
          # there would pull audiopus/rubato without a capture path.
          - target: aarch64-apple-darwin
            runner: macos-14
            archive_ext: tar.gz
            bin: oxiremote
            cargo_features: audio
          # Temporarily disabled — GitHub-hosted macos-13 runners are
          # heavily oversubscribed and jobs sit queued for 25+ minutes,
          # blocking the publish-release job. Apple Silicon is dominant;
          # Intel-Mac users can build from source (cargo install) until
          # we wire up cross-compile or a self-hosted Mac runner. Re-enable
          # by uncommenting this block.
          # - target: x86_64-apple-darwin
          #   runner: macos-13
          #   archive_ext: tar.gz
          #   bin: oxiremote
          #   cargo_features: audio
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            archive_ext: tar.gz
            bin: oxiremote
            cargo_features: ''
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            archive_ext: tar.gz
            bin: oxiremote
            cargo_features: ''
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            archive_ext: zip
            bin: oxiremote.exe
            cargo_features: audio
    steps:
      - uses: actions/checkout@v5

      - name: Resolve version
        id: version
        shell: bash
        run: |
          # Workflow may be triggered by tag push or manual dispatch.
          if [ -n "${{ inputs.tag }}" ]; then
            tag="${{ inputs.tag }}"
          else
            tag="${GITHUB_REF#refs/tags/}"
          fi
          version="${tag#v}"
          echo "tag=$tag"         >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: agent -> target

      # Linux: X11/xcb headers for the desktop crate + glib/gtk/appindicator
      # for tray-icon (gobject-sys / glib-sys hard-fail without libglib2.0-dev,
      # tray-icon itself needs libgtk-3-dev + libayatana-appindicator3-dev) +
      # nasm for libjpeg-turbo SIMD on x86_64 (turbojpeg-sys emits a warning
      # if nasm is missing; ARM uses Clang NEON intrinsics but nasm is harmless).
      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libx11-dev libxcb-randr0-dev libxcb-xtest0-dev libxcb-xinerama0-dev \
            libxcb-shape0-dev libxcb-xkb-dev libxkbcommon-dev libxcb-cursor-dev \
            libglib2.0-dev libgtk-3-dev libayatana-appindicator3-dev \
            libxdo-dev libwayland-dev libgbm-dev libpipewire-0.3-dev \
            pkg-config nasm \
            libvpx-dev libaom-dev libclang-dev clang

      # macOS: VP9/AV1 software encoders need libvpx + libaom system libs
      # and llvm/libclang for bindgen. brew is pre-installed on the runner;
      # `clang` ships with Xcode so we only fetch the codec libs and llvm
      # (which provides libclang for bindgen).
      - name: Install macOS video codec deps
        if: runner.os == 'macOS'
        run: brew install libvpx aom llvm

      # Windows: vcpkg installs libvpx + libaom static libs. bindgen finds
      # libclang via the LLVM Chocolatey package (already pre-installed on
      # windows-2022 runners under C:\Program Files\LLVM\bin). We export
      # LIBCLANG_PATH and BINDGEN_EXTRA_CLANG_ARGS so bindgen picks up the
      # vcpkg include dirs.
      #
      # `pkgconfiglite` is required by build.rs (pkg-config crate probes for
      # libvpx + libaom). Windows-latest does not ship pkg-config preinstalled.
      # PKG_CONFIG_ALLOW_SYSTEM_LIBS / _CFLAGS bypass pkg-config's "system
      # path" filter on Windows, where vcpkg outputs land under non-prefix
      # dirs that pkg-config would otherwise reject.
      - name: Install Windows video codec deps
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install pkgconfiglite --no-progress --yes
          vcpkg install libvpx:x64-windows-static aom:x64-windows-static
          echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV
          echo "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV
          echo "PKG_CONFIG_PATH=$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows-static\lib\pkgconfig" >> $env:GITHUB_ENV
          echo "PKG_CONFIG_ALLOW_SYSTEM_LIBS=1" >> $env:GITHUB_ENV
          echo "PKG_CONFIG_ALLOW_SYSTEM_CFLAGS=1" >> $env:GITHUB_ENV
          echo "VPX_STATIC=1" >> $env:GITHUB_ENV
          echo "AOM_STATIC=1" >> $env:GITHUB_ENV
          echo "BINDGEN_EXTRA_CLANG_ARGS=-I$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows-static\include" >> $env:GITHUB_ENV

      # macOS: audiopus_sys 0.1.8 builds vendored libopus from source via
      # autotools when pkg-config can't find a system Opus. The GitHub-hosted
      # macos-14 runner doesn't have autoreconf on PATH by default, so the
      # autogen.sh step fails. Install autoconf + automake + libtool only on
      # rows that enable the audio feature, so audio-disabled builds (none
      # today, but future-proof) stay cheap.
      - name: Install macOS audio build deps
        if: runner.os == 'macOS' && matrix.cargo_features == 'audio'
        run: brew install autoconf automake libtool

      - name: Install JS deps + build web assets
        run: |
          bun install --frozen-lockfile
          bun run build:web

      - name: Build release binary
        shell: bash
        run: |
          features="${{ matrix.cargo_features }}"
          extra=()
          if [ -n "$features" ]; then
            extra+=(--features "$features")
          fi
          cargo build --release --manifest-path agent/Cargo.toml --target ${{ matrix.target }} "${extra[@]}"

      - name: Stage artifact
        id: stage
        shell: bash
        run: |
          version="${{ steps.version.outputs.version }}"
          target="${{ matrix.target }}"
          stem="oxiremote-${version}-${target}"
          mkdir -p dist/$stem
          src="agent/target/${target}/release/${{ matrix.bin }}"
          cp "$src" "dist/$stem/${{ matrix.bin }}"
          cp README.md LICENSE "dist/$stem/" 2>/dev/null || true
          cd dist
          if [ "${{ matrix.archive_ext }}" = "zip" ]; then
            7z a "$stem.zip" "$stem"
          else
            tar -czf "$stem.tar.gz" "$stem"
          fi
          asset="$stem.${{ matrix.archive_ext }}"
          # SHA256 — Linux + macOS shasum, Windows certutil. Output `<sha>  <name>`.
          if command -v shasum >/dev/null 2>&1; then
            shasum -a 256 "$asset" > "$asset.sha256"
          else
            certutil -hashfile "$asset" SHA256 | sed -n 2p | tr -d '\r ' | awk -v f="$asset" '{print $1"  "f}' > "$asset.sha256"
          fi
          echo "asset=dist/$asset"      >> "$GITHUB_OUTPUT"
          echo "sha256=dist/$asset.sha256" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v5
        with:
          name: oxiremote-${{ matrix.target }}
          path: |
            ${{ steps.stage.outputs.asset }}
            ${{ steps.stage.outputs.sha256 }}
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [ -n "${{ inputs.tag }}" ]; then tag="${{ inputs.tag }}"; else tag="${GITHUB_REF#refs/tags/}"; fi
          echo "tag=$tag"            >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}"    >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v5
        with:
          path: artifacts

      - name: Combine SHA256 manifest
        id: manifest
        shell: bash
        run: |
          version="${{ steps.version.outputs.version }}"
          mkdir -p release
          # Copy each archive next to a single combined SHA manifest.
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' \) -exec cp {} release/ \;
          manifest="release/oxiremote-${version}-sha256.txt"
          : > "$manifest"
          # Concatenate per-asset .sha256 lines into one file. Filenames
          # already match the asset basenames thanks to the build step.
          find artifacts -type f -name '*.sha256' -print0 | sort -z | while IFS= read -r -d '' f; do
            cat "$f" >> "$manifest"
          done
          echo "Manifest:"; cat "$manifest"

      - name: Create / update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          tag="${{ steps.version.outputs.tag }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" release/* --clobber
          else
            gh release create "$tag" release/* \
              --title "$tag" \
              --notes "Automated release. Verify downloads with \`oxiremote-${tag#v}-sha256.txt\`."
          fi

  # Publishes the npm-wrapper to npmjs.org once binaries exist on the GitHub
  # release. The wrapper's `prepublishOnly` (verify-release-assets.js) probes
  # those release URLs anonymously, so this job must run AFTER `publish`
  # finishes creating/updating the release. NPM_TOKEN is an automation token
  # configured in repo secrets — never inline.
  publish-npm:
    name: publish npm wrapper
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      - name: Publish npm-wrapper
        working-directory: npm-wrapper
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        # `--provenance` would require id-token: write at the workflow level
        # plus a public repo; skip until those are wired up explicitly.
        run: npm publish --access public
