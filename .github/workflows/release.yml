name: release

# Triggered by `git tag vX.Y.Z && git push --tags`. Builds the agent binary
# on a native runner per target, uploads each artifact + a SHA256 manifest
# to a GitHub Release named `vX.Y.Z`. The manifest is what `oxiremote update`
# verifies downloads against — keep its filename in sync with `update.rs`.

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build"
        required: true

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-14
            archive_ext: tar.gz
            bin: oxiremote
          # Temporarily disabled — GitHub-hosted macos-13 runners are
          # heavily oversubscribed and jobs sit queued for 25+ minutes,
          # blocking the publish-release job. Apple Silicon is dominant;
          # Intel-Mac users can build from source (cargo install) until
          # we wire up cross-compile or a self-hosted Mac runner. Re-enable
          # by uncommenting this block.
          # - target: x86_64-apple-darwin
          #   runner: macos-13
          #   archive_ext: tar.gz
          #   bin: oxiremote
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            archive_ext: tar.gz
            bin: oxiremote
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            archive_ext: tar.gz
            bin: oxiremote
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            archive_ext: zip
            bin: oxiremote.exe
    steps:
      - uses: actions/checkout@v5

      - name: Resolve version
        id: version
        shell: bash
        run: |
          # Workflow may be triggered by tag push or manual dispatch.
          if [ -n "${{ inputs.tag }}" ]; then
            tag="${{ inputs.tag }}"
          else
            tag="${GITHUB_REF#refs/tags/}"
          fi
          version="${tag#v}"
          echo "tag=$tag"         >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: agent -> target

      # Linux: X11/xcb headers for the desktop crate + glib/gtk/appindicator
      # for tray-icon (gobject-sys / glib-sys hard-fail without libglib2.0-dev,
      # tray-icon itself needs libgtk-3-dev + libayatana-appindicator3-dev) +
      # nasm for libjpeg-turbo SIMD on x86_64 (turbojpeg-sys emits a warning
      # if nasm is missing; ARM uses Clang NEON intrinsics but nasm is harmless).
      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libx11-dev libxcb-randr0-dev libxcb-xtest0-dev libxcb-xinerama0-dev \
            libxcb-shape0-dev libxcb-xkb-dev libxkbcommon-dev libxcb-cursor-dev \
            libglib2.0-dev libgtk-3-dev libayatana-appindicator3-dev \
            libxdo-dev libwayland-dev libgbm-dev libpipewire-0.3-dev \
            pkg-config nasm

      - name: Install JS deps + build web assets
        run: |
          bun install --frozen-lockfile
          bun run build:web

      - name: Build release binary
        shell: bash
        run: |
          cargo build --release --manifest-path agent/Cargo.toml --target ${{ matrix.target }}

      - name: Stage artifact
        id: stage
        shell: bash
        run: |
          version="${{ steps.version.outputs.version }}"
          target="${{ matrix.target }}"
          stem="oxiremote-${version}-${target}"
          mkdir -p dist/$stem
          src="agent/target/${target}/release/${{ matrix.bin }}"
          cp "$src" "dist/$stem/${{ matrix.bin }}"
          cp README.md LICENSE "dist/$stem/" 2>/dev/null || true
          cd dist
          if [ "${{ matrix.archive_ext }}" = "zip" ]; then
            7z a "$stem.zip" "$stem"
          else
            tar -czf "$stem.tar.gz" "$stem"
          fi
          asset="$stem.${{ matrix.archive_ext }}"
          # SHA256 — Linux + macOS shasum, Windows certutil. Output `<sha>  <name>`.
          if command -v shasum >/dev/null 2>&1; then
            shasum -a 256 "$asset" > "$asset.sha256"
          else
            certutil -hashfile "$asset" SHA256 | sed -n 2p | tr -d '\r ' | awk -v f="$asset" '{print $1"  "f}' > "$asset.sha256"
          fi
          echo "asset=dist/$asset"      >> "$GITHUB_OUTPUT"
          echo "sha256=dist/$asset.sha256" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v5
        with:
          name: oxiremote-${{ matrix.target }}
          path: |
            ${{ steps.stage.outputs.asset }}
            ${{ steps.stage.outputs.sha256 }}
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [ -n "${{ inputs.tag }}" ]; then tag="${{ inputs.tag }}"; else tag="${GITHUB_REF#refs/tags/}"; fi
          echo "tag=$tag"            >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}"    >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v5
        with:
          path: artifacts

      # Soft-launch gate. Signing is enabled when the operator has provisioned
      # `MINISIGN_SECRET_KEY` (and `MINISIGN_PASSPHRASE`) as repo secrets AND
      # replaced the `TRUSTED_PUBKEYS` placeholder in `agent/src/update_signing.rs`.
      # v0.1.25 ships unsigned per the transition contract documented in
      # `update_signing.rs`; v0.1.26 onward must publish signed.
      - name: Detect signing capability
        id: signing
        shell: bash
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          set -euo pipefail
          if [ -n "${MINISIGN_SECRET_KEY:-}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Signing: enabled (MINISIGN_SECRET_KEY is set)"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Signing: disabled — soft-launch / v0.1.25 transition release."
            echo "          Set MINISIGN_SECRET_KEY + MINISIGN_PASSPHRASE secrets"
            echo "          and replace the TRUSTED_PUBKEYS placeholder before v0.1.26."
          fi

      - name: Combine SHA256 manifest
        id: manifest
        shell: bash
        run: |
          version="${{ steps.version.outputs.version }}"
          mkdir -p release
          # Copy each archive next to a single combined SHA manifest.
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' \) -exec cp {} release/ \;
          manifest="release/oxiremote-${version}-sha256.txt"
          : > "$manifest"
          # Concatenate per-asset .sha256 lines into one file. Filenames
          # already match the asset basenames thanks to the build step.
          find artifacts -type f -name '*.sha256' -print0 | sort -z | while IFS= read -r -d '' f; do
            cat "$f" >> "$manifest"
          done
          echo "Manifest:"; cat "$manifest"

      # Phase 03 / C4 — minisign Ed25519 signature manifest. Verified on
      # the agent side via `update_signing::verify` against the embedded
      # `TRUSTED_PUBKEYS` array. Must run AFTER `Combine SHA256 manifest`
      # so the SHA file is also signed end-to-end with the rest of the
      # release archives. See `docs/release-signing.md` for custodian +
      # rotation rules.

      # CI gate (Red Team R5) — refuse to publish if the source still
      # carries the placeholder pubkey. verify_with_keys would skip it at
      # runtime, but the publisher would only learn after every client's
      # `oxiremote update` started failing.
      - name: Verify TRUSTED_PUBKEYS has been provisioned
        if: steps.signing.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if grep -q 'REPLACE_WITH_PRODUCTION_PUBKEY_BEFORE_RELEASE' \
                  agent/src/update_signing.rs; then
            echo "ERROR: agent/src/update_signing.rs::TRUSTED_PUBKEYS still contains the placeholder." >&2
            echo "       Generate the K1 keypair (see docs/release-signing.md) and commit the public key before tagging." >&2
            exit 1
          fi

      - name: Install minisign + expect
        if: steps.signing.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y minisign expect

      - name: Sign artifacts with minisign
        if: steps.signing.outputs.enabled == 'true'
        timeout-minutes: 10
        env:
          # Bound to the env table so expect can read them via $env(NAME)
          # without bash interpolating into the heredoc body (Red Team R1).
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PASSPHRASE: ${{ secrets.MINISIGN_PASSPHRASE }}
        shell: bash
        run: |
          # Reliability: -e fails the step on any non-zero exit (so a stuck
          # expect or missing minisig file cannot leave us with a partial
          # manifest, Red Team R4); -u catches typos in env var names; -o
          # pipefail propagates failures through the find|sort pipeline.
          set -euo pipefail

          if [ -z "${MINISIGN_SECRET_KEY:-}" ] || [ -z "${MINISIGN_PASSPHRASE:-}" ]; then
            echo "ERROR: MINISIGN_SECRET_KEY and MINISIGN_PASSPHRASE must be configured." >&2
            echo "       See docs/release-signing.md for setup." >&2
            exit 1
          fi
          version="${{ steps.version.outputs.version }}"

          # Write secret key to a chmod-600 temp file. shredded on EXIT
          # regardless of the step's success/failure.
          seckey="$(mktemp -t oxi-minisign-XXXXXX)"
          chmod 600 "$seckey"
          trap 'shred -u "$seckey" 2>/dev/null || rm -f "$seckey"' EXIT
          printf '%s' "$MINISIGN_SECRET_KEY" > "$seckey"
          export MINISIGN_SECKEY_PATH="$seckey"

          sig_manifest="release/oxiremote-${version}-minisig.txt"
          : > "$sig_manifest"

          # Sign each archive (tar.gz + zip). We deliberately do NOT sign
          # the SHA manifest — verifiers chain SHA → archive → sig and
          # signing the SHA file separately would just add a useless layer.
          for asset in $(find release -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.zip' \) | sort); do
            base="$(basename "$asset")"
            echo "Signing $base"

            # `expect -c '...'` instead of a heredoc: a heredoc terminator
            # has to sit at column 0 and that breaks the surrounding YAML
            # `run: |` block scalar (column 0 ends the scalar). Single-quoted
            # bash preserves the Tcl `$env(...)` lookups verbatim so the
            # passphrase still never expands in the bash layer (Red Team R1).
            export MINISIGN_ASSET_PATH="$asset"
            export MINISIGN_ASSET_BASE="$base"
            expect -c '
              set timeout 60
              spawn minisign -S -s $env(MINISIGN_SECKEY_PATH) \
                             -m $env(MINISIGN_ASSET_PATH) \
                             -t "timestamp:[clock seconds]\tfile:$env(MINISIGN_ASSET_BASE)"
              expect {
                "Password:"     { send -- "$env(MINISIGN_PASSPHRASE)\r" }
                "password:"     { send -- "$env(MINISIGN_PASSPHRASE)\r" }
                "Passphrase:"   { send -- "$env(MINISIGN_PASSPHRASE)\r" }
                timeout         { puts stderr "minisign passphrase prompt did not appear within 60s"; exit 1 }
              }
              expect {
                eof             { }
                timeout         { puts stderr "minisign sign did not finish within 60s"; exit 1 }
              }
              catch wait result
              set status [lindex $result 3]
              if {$status != 0} {
                puts stderr "minisign exited non-zero: $status"
                exit 1
              }
            '
            # Confirm the .minisig file actually exists before appending — a
            # silent expect failure cannot now produce a half-written manifest.
            if [ ! -f "$asset.minisig" ]; then
              echo "ERROR: minisign did not produce $asset.minisig" >&2
              exit 1
            fi
            cat "$asset.minisig" >> "$sig_manifest"
            # Blank-line separator between blocks so the parser can split
            # cleanly (see `parse_minisig_manifest`).
            printf '\n' >> "$sig_manifest"
          done

          echo "--- Signature manifest ---"
          cat "$sig_manifest"

      - name: Create / update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          tag="${{ steps.version.outputs.tag }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" release/* --clobber
          else
            gh release create "$tag" release/* \
              --title "$tag" \
              --notes "Automated release. Verify downloads with \`oxiremote-${tag#v}-sha256.txt\`."
          fi

  # Publishes the npm-wrapper to npmjs.org once binaries exist on the GitHub
  # release. The wrapper's `prepublishOnly` (verify-release-assets.js) probes
  # those release URLs anonymously, so this job must run AFTER `publish`
  # finishes creating/updating the release. NPM_TOKEN is an automation token
  # configured in repo secrets — never inline.
  publish-npm:
    name: publish npm wrapper
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      - name: Publish npm-wrapper
        working-directory: npm-wrapper
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        # `--provenance` would require id-token: write at the workflow level
        # plus a public repo; skip until those are wired up explicitly.
        run: npm publish --access public
