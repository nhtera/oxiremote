[package]
name = "desktop"
version = "0.1.32"
edition = "2024"

[features]
default = []
# H.264 pipeline (Phase 03). VideoToolbox on macOS, openh264 as cross-platform
# fallback. Gated so the JPEG-only build keeps working during rollout and so CI
# can compile without the openh264 C++ toolchain. The objc2-* deps resolve to
# nothing on non-macOS targets via their target cfg.
h264 = [
    "dep:openh264",
    "dep:yuvutils-rs",
    "dep:objc2-video-toolbox",
    "dep:objc2-core-video",
    "dep:objc2-core-media",
    "dep:objc2-core-foundation",
]

[dependencies]
xcap = "0.9"
# libjpeg-turbo binding: ~5× faster per tile than mozjpeg, RGBA in directly.
# Pulls bundled libjpeg-turbo via turbojpeg-sys; build needs cmake + nasm.
turbojpeg = "1"
# enigo's Linux build requires one of wayland/x11rb/xdo/libei_*; pick x11rb
# because it's pure-Rust (no extra system dep beyond the libxcb headers we
# already install) and the agent runs in X11 / XWayland today. macOS and
# Windows ignore the feature.
enigo = { version = "0.6", default-features = false, features = ["x11rb"] }
xxhash-rust = { version = "0.8", features = ["xxh3"] }
image = { version = "0.25", default-features = false, features = ["jpeg"] }
# SIMD-accelerated resize — replaces image::imageops::resize for the
# capture-pipeline downscale (CPU-bound on Apple Silicon: ~20 ms → ~4 ms
# per frame at logical→tier dims, lifting High tier from ~22 fps to ~30+).
fast_image_resize = { version = "6", features = ["image"] }
anyhow = "1"
bytes = "1"
tracing = "0.1"
tokio = { version = "1", features = ["rt", "sync", "time"] }
rayon = "1"

# Phase 03 SW fallback encoder. `source` feature statically compiles Cisco's
# OpenH264 into the binary — no dlopen, no separate dylib. MPEG LA legal review
# required before public release (see phase-03 memo).
openh264 = { version = "0.9", features = ["source"], optional = true }
# BGRA→I420 conversion for the OpenH264 input path (NEON on Apple Silicon,
# AVX2 on x86). Pure Rust; no C toolchain dependency unlike libyuv-sys.
yuvutils-rs = { version = "0.8", optional = true }

# Phase 03 macOS hardware encoder. Raw FFI to VideoToolbox/CoreMedia via the
# madsmtm/objc2 ecosystem — auto-generated from Apple SDK headers. All four
# objc2-* crates must stay on the same minor version (they version-lock).
#
# `screencapturekit` is the high-level wrapper around Apple's
# ScreenCaptureKit framework (macOS 12.3+). Replaces xcap's
# CGWindowListCreateImage hot path — SCK delivers pre-resized BGRA frames
# at native frame cadence via GPU IOSurface, lifting capture from ~28 ms
# to ~3–5 ms / frame. xcap stays as fallback for pre-12.3 hosts and for
# the JPEG-pipeline diff path. Mandatory on macOS — ifeel of the agent
# binary on this platform pulls it in unconditionally.
[target.'cfg(target_os = "macos")'.dependencies]
objc2-video-toolbox = { version = "0.3", optional = true }
objc2-core-video = { version = "0.3", optional = true }
objc2-core-media = { version = "0.3", optional = true }
objc2-core-foundation = { version = "0.3", optional = true }
screencapturekit = "1.5"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
