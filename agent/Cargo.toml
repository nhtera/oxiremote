[workspace]
members = [".", "crates/desktop"]

[package]
name = "oxiremote"
version = "0.1.0"
edition = "2024"
description = "Self-hosted remote-access agent — terminal, files, preview, and remote desktop over a Cloudflare tunnel."
repository = "https://github.com/nhtera/oxiremote"
license = "MIT"

[[bin]]
name = "oxiremote"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
axum = { version = "0.8", features = ["macros", "ws", "multipart"] }
axum-extra = { version = "0.10", features = ["cookie"] }
base32 = "0.5"
base64 = "0.22"
bytes = "1.10"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
hex = "0.4"
hmac = "0.12"
http = "1.3"
rand = "0.9"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.11"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2", "charset", "gzip", "stream", "blocking"] }
sha2 = "0.10"
tar = "0.4"
flate2 = "1.1"
time = "0.3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "process", "fs", "io-util"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-util = { version = "0.7", features = ["io"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }

blake3 = "1"
gethostname = "0.4"
portable-pty = "0.9"
dashmap = "6"
tokio-tungstenite = { version = "0.26", features = ["connect"] }
futures-util = "0.3"
rust-embed = { version = "8", features = ["compression"] }
mime_guess = "2"

# Web Push (RFC 8291) — VAPID JWT (ES256) + aes128gcm payload encryption
p256 = { version = "0.13", features = ["ecdh", "ecdsa", "arithmetic"] }
aes-gcm = "0.10"
hkdf = "0.12"
subtle = "2"

# Per-device API key hashing for tunnel-side Bearer auth.
argon2 = "0.5"
toml = "0.8"

# Phase 01: interactive TUI + system tray + QR codes.
ratatui = "0.29"
crossterm = "0.28"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
tray-icon = "0.19"
notify-rust = "4"
image = { version = "0.25", default-features = false, features = ["png"] }
open = "5"

# Detach child from controlling TTY in `oxiremote ui` (setsid).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Phase 03: remote desktop capture + encode (optional, enabled by default).
desktop = { path = "crates/desktop", optional = true }

# Phase 04: WebRTC DataChannel transport for remote desktop streaming.
webrtc = { version = "0.11", optional = true }
# Phase 03 RTCP feedback parsing (PLI, REMB) — webrtc-rs pulls rtcp 0.11
# transitively but doesn't re-export the packet types we need to downcast to.
rtcp = { version = "0.11", optional = true }

[features]
default = ["desktop"]
desktop = ["dep:desktop", "dep:webrtc"]
# Phase 03 H.264 pipeline (VT on macOS, OpenH264 fallback). Adds WebRTC
# video track + capabilities exchange. Gated so the default JPEG build stays
# compile-clean while H.264 is under active development.
h264 = ["desktop", "desktop/h264", "dep:rtcp"]
