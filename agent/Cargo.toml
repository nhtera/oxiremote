[package]
name = "agent"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
axum = { version = "0.8", features = ["macros", "ws"] }
axum-extra = { version = "0.10", features = ["cookie"] }
base64 = "0.22"
bytes = "1.10"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
hex = "0.4"
hmac = "0.12"
http = "1.3"
rand = "0.9"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.11"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2", "charset", "gzip", "stream"] }
sha2 = "0.10"
tar = "0.4"
flate2 = "1.1"
time = "0.3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "process", "fs"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }

blake3 = "1"
gethostname = "0.4"
portable-pty = "0.9"
dashmap = "6"
tokio-tungstenite = { version = "0.26", features = ["connect"] }
futures-util = "0.3"
rust-embed = { version = "8", features = ["compression"] }
mime_guess = "2"

# Web Push (RFC 8291) — VAPID JWT (ES256) + aes128gcm payload encryption
p256 = { version = "0.13", features = ["ecdh", "ecdsa", "arithmetic"] }
aes-gcm = "0.10"
hkdf = "0.12"
subtle = "2"
